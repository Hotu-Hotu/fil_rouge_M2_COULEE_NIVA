# Pour l'instant : la base de donnees seule. L'API et le worker y seront ajoutes a l'etape 4.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcription}
      POSTGRES_USER: ${POSTGRES_USER:-transcription}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcription}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-transcription}"]
      interval: 5s
      retries: 10

volumes:
  db-data:
